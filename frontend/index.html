<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Empréstimos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231565C0'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Inter,sans-serif' font-size='18' font-weight='700' fill='white'>%24</text></svg>" />
</head>

<body>
  <main>
    <h1 class="page-title">Calculadora de Empréstimos</h1>

    <section class="form-card" aria-label="Parâmetros do empréstimo">
      <div class="form-body">

        <div class="field">
          <label for="dataInicial">Data Inicial <span class="req">*</span></label>
          <input type="date" id="dataInicial" required />
          <span class="field-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="dataFinal">Data Final <span class="req">*</span></label>
          <input type="date" id="dataFinal" required />
          <span class="field-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="primeiroPagamento">Primeiro Pagamento <span class="req">*</span></label>
          <input type="date" id="primeiroPagamento" required />
          <span class="field-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="valorEmprestimo">Valor de Empréstimo <span class="req">*</span></label>
          <input type="number" id="valorEmprestimo" min="0.01" step="0.01" placeholder="140000" required />
          <span class="field-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="taxaJuros">Taxa de Juros <span class="req">*</span></label>
          <input type="number" id="taxaJuros" min="0" max="100" step="0.01" placeholder="7" required />
          <span class="field-error" role="alert"></span>
        </div>

        <div style="flex-shrink:0">
          <button id="btnCalcular" class="btn-calcular" disabled type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-text">Calcular</span>
          </button>
        </div>

      </div>

      <div id="alertError" class="alert alert-error" role="alert" aria-live="polite"></div>
      <div class="summary-bar">
        <span id="chipParcelas" class="chip"></span>
        <span id="chipAmort" class="chip"></span>
      </div>
    </section>

    <section id="tableCard" class="table-card">
      <div class="table-wrapper" tabindex="0">
        <table>
          <thead>
            <tr class="row-groups">
              <th class="th-group-empty" colspan="3"></th>
              <th class="th-group-parcela" colspan="2" scope="colgroup">Parcela</th>
              <th class="th-group-principal" colspan="2" scope="colgroup">Principal</th>
              <th class="th-group-juros" colspan="3" scope="colgroup">Juros</th>
            </tr>
            <tr class="row-cols">
              <th class="tc-data" scope="col">Data Competência</th>
              <th class="tc-val-emp" scope="col">Valor de Empréstimo</th>
              <th class="tc-saldo-dev" scope="col">Saldo Devedor</th>
              <th class="tc-consolidada sep-parcela" scope="col">Consolidada</th>
              <th class="tc-total" scope="col">Total</th>
              <th class="tc-amort sep-principal" scope="col">Amortização</th>
              <th class="tc-saldo" scope="col">Saldo</th>
              <th class="tc-provisao sep-juros" scope="col">Provisão</th>
              <th class="tc-acumulado" scope="col">Acumulado</th>
              <th class="tc-pago" scope="col">Pago</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>

</html>
